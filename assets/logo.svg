<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="wire-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="pin-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="240" rx="16" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Spatial Wire Grid Mesh -->
  <g opacity="0.18" stroke="#00F0FF" stroke-width="1">
    <line x1="30" y1="40" x2="230" y2="40" stroke-dasharray="4,4"/>
    <line x1="30" y1="80" x2="230" y2="80" stroke-dasharray="4,4"/>
    <line x1="30" y1="120" x2="230" y2="120" stroke-dasharray="4,4"/>
    <line x1="30" y1="160" x2="230" y2="160" stroke-dasharray="4,4"/>
    <line x1="30" y1="200" x2="230" y2="200" stroke-dasharray="4,4"/>
    
    <line x1="50" y1="20" x2="50" y2="220" stroke-dasharray="4,4"/>
    <line x1="90" y1="20" x2="90" y2="220" stroke-dasharray="4,4"/>
    <line x1="130" y1="20" x2="130" y2="220" stroke-dasharray="4,4"/>
    <line x1="170" y1="20" x2="170" y2="220" stroke-dasharray="4,4"/>
    <line x1="210" y1="20" x2="210" y2="220" stroke-dasharray="4,4"/>
  </g>

  <!-- Geometric Spatial Wire Icon -->
  <g transform="translate(130, 120)">
    <!-- Outer Protobuf Nodes -->
    <polygon points="0,-75 65,-25 65,45 0,85 -65,45 -65,-25" fill="none" stroke="url(#wire-cyan)" stroke-width="3" filter="url(#neon-glow)"/>
    <line x1="0" y1="-75" x2="0" y2="85" stroke="#38BDF8" stroke-width="1.5" opacity="0.5"/>
    <line x1="-65" y1="-25" x2="65" y2="45" stroke="#38BDF8" stroke-width="1.5" opacity="0.5"/>
    <line x1="-65" y1="45" x2="65" y2="-25" stroke="#38BDF8" stroke-width="1.5" opacity="0.5"/>

    <!-- Data Nodes -->
    <circle cx="0" cy="-75" r="5" fill="#00F0FF"/>
    <circle cx="65" cy="-25" r="5" fill="#3B82F6"/>
    <circle cx="65" cy="45" r="5" fill="#00F0FF"/>
    <circle cx="0" cy="85" r="5" fill="#3B82F6"/>
    <circle cx="-65" cy="45" r="5" fill="#00F0FF"/>
    <circle cx="-65" cy="-25" r="5" fill="#3B82F6"/>

    <!-- Central Focal Spatial Pin -->
    <path d="M0,-24 C-12,-24 -18,-15 -18,-3 C-18,12 0,26 0,26 C0,26 18,12 18,-3 C18,-15 12,-24 0,-24 Z" fill="url(#pin-emerald)" filter="url(#neon-glow)"/>
    <circle cx="0" cy="-6" r="6" fill="#FFFFFF"/>
  </g>

  <!-- Typography -->
  <text x="260" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="3">
    CARTO<tspan fill="#00F0FF">WIRE</tspan>
  </text>
  <text x="265" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="14" fill="#94A3B8" letter-spacing="6">
    WIRE-NATIVE GEOSPATIAL INTELLIGENCE CORE
  </text>

  <!-- Badges Preview on Logo -->
  <g transform="translate(265, 172)">
    <rect width="110" height="22" rx="4" fill="#0F172A" stroke="#0284C7" stroke-width="1"/>
    <text x="55" y="15" font-family="monospace" font-size="11" fill="#38BDF8" text-anchor="middle">PROTOBUF 3.0</text>
  </g>
  <g transform="translate(385, 172)">
    <rect width="110" height="22" rx="4" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="55" y="15" font-family="monospace" font-size="11" fill="#34D399" text-anchor="middle">FASTMCP READY</text>
  </g>
  <g transform="translate(505, 172)">
    <rect width="120" height="22" rx="4" fill="#0F172A" stroke="#8B5CF6" stroke-width="1"/>
    <text x="60" y="15" font-family="monospace" font-size="11" fill="#A78BFA" text-anchor="middle">ZERO-DOM BYPASS</text>
  </g>
</svg>